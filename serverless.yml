service: mimotomipasion-marketplace-api

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  environment:
    STAGE: ${self:provider.stage}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
    DYNAMODB_TABLE: ${self:service}-partes-${self:provider.stage}
    DYNAMODB_ENDPOINT: ${self:custom.dynamodbEndpoint.${self:provider.stage}, ''}

custom:
  dynamodbEndpoint:
    dev: "http://localhost:8000"
    prod: ""
  serverless-offline:
    httpPort: 3000
    host: 0.0.0.0
    noPrependStageInUrl: true
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: false
      seed: false
      accessKeyId: "local"
      secretAccessKey: "local"

functions:
  crearParte:
    handler: src/functions/partes.crear
    events:
      - http:
          path: partes
          method: post
          cors: true

  listarPartes:
    handler: src/functions/partes.listar
    events:
      - http:
          path: partes
          method: get
          cors: true

  obtenerParte:
    handler: src/functions/partes.obtener
    events:
      - http:
          path: partes/{id}
          method: get
          cors: true

  eliminarParte:
    handler: src/functions/partes.eliminar
    events:
      - http:
          path: partes/{id}
          method: delete
          cors: true

resources:
  Resources:
    PartesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: tipo
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tipo-createdAt-index
            KeySchema:
              - AttributeName: tipo
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

plugins:
  - serverless-dynamodb-local
  - serverless-offline
